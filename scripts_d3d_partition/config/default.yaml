# Differentiable 3D Partitioner Flow Configuration
# Default configuration file
design:
  name: "gcd"

# Training parameters
flow:
  num_iterations: 5000
  # Set to an integer to make t initialization and later sampling reproducible.
  random_seed: null

  optimizer:
    learning_rate: 0.1
    
  lse_smoothing_alpha:
    start: 20.0
    end: 20.0

  # Cutsize Loss configuration
  cutsize_loss:
    enabled: true
    lambda_cut:
      start: 1000.0
      end: 10000.0
      gamma: 0.2

  # Balance Loss configuration
  balance_loss:
    enabled: true
    lambda_balance:
      start: 0.0
      end: 5.0
      gamma: 10.0

  # Density Loss configuration (DREAMPlace density overflow, top + bottom layer)
  density_loss:
    enabled: false
    lambda_density:
      start: 0.0
      end: 500.0
      gamma: 1.0

  # Wirelength Loss configuration
  wirelength_loss:
    lambda_wl: 1.0

# Partitioner initialization parameters
partitioner:
  # Gumbel Softmax temperature parameter, controls the smoothness of softmax
  # Smaller values mean results are closer to discrete distribution, larger values mean smoother distribution
  gumbel_tau: 0.1
  # Optional annealing schedule.
  # If not specified in a case config, the code anneals from max(1.0, gumbel_tau)
  # down to gumbel_tau across the optimization horizon.
  gumbel_tau_start: 1.0
  gumbel_tau_min: 0.1
  gumbel_anneal_iterations: 5000
  gumbel_anneal_mode: exponential
  # Iteration number to switch from sigmoid to gumbel_softmax
  # 0 means using gumbel_softmax from the beginning
  gumbel_switch_iteration: 0

  # Balance configuration
  balance_loss:
    threshold_factor: 0.7
    num_bins_x: 4
    num_bins_y: 4

# Visualization configuration
visualization:
  output_dir: "results/visualizations"
  save_interval: 50
  log_interval: 10

# Output configuration
output:

  save_training_curves: true
  result_dir: "results"
