design:
  name: "d3d_tie_smoke"

# Small deterministic grid for the smoke case only.
d2d:
  num_bins_x: 64
  num_bins_y: 64
  global_place_stages:
    - num_bins_x: 64
      num_bins_y: 64

flow:
  num_iterations: 600
  random_seed: 905
  optimizer:
    name: nesterov
    learning_rate: 0.1
    use_bb: true
  lse_smoothing_alpha:
    start: 5.0
    end: 50.0
  cutsize_loss:
    enabled: true
    lambda_cut:
      start: 100.0
      end: 100.0
      gamma: 1.0
  balance_loss:
    enabled: true
    lambda_balance:
      start: 5000.0
      end: 5000.0
      gamma: 1.0
  density_loss:
    enabled: true
    lambda_density:
      start: 0.000000001
      peak: 0.00001
      end: 0.00001
      peak_ratio: 0.3
      gamma_up: 1.0
      gamma_down: 1.0
  wirelength_loss:
    lambda_wl: 1.0

partitioner:
  t_grad_scale_start: 0.0001
  t_grad_scale_end: 100.0
  t_grad_warmup_end: 50
  t_grad_ramp_end: 400
  gumbel_tau: 0.1
  gumbel_tau_start: 1.0
  gumbel_tau_min: 0.1
  gumbel_anneal_iterations: 600
  gumbel_anneal_mode: exponential
  gumbel_switch_iteration: 100
  balance_loss:
    top_threshold_factor: 0.7
    bottom_threshold_factor: 0.7
    num_bins_x: 2
    num_bins_y: 2

visualization:
  output_dir: "results/visualizations"
  save_interval: 100
  log_interval: 100

output:
  save_training_curves: true
  result_dir: "results"
